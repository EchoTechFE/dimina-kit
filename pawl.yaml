# pawl — anti-regression quality gate (https://github.com/tiangong-dev/pawl)
# `pawl check` fails when any dimension regresses against pawl.snapshot.json;
# `pawl record` locks in improvements. Every dimension is either a native
# builtin or a project-specific exec adapter. Builtins own the generic
# filesystem/ESLint integration; exec adapters remain only where dimina-kit
# needs monorepo aggregation or richer project-specific measurements. The
# dimina/ submodule is out of scope for every dimension.

dimensions:
  - id: "file-length"
    title: "Files over 500 lines"
    direction: "lower-is-better"
    gate: "total"
    builtin: "file-length"
    options:
      threshold: 500
      include:
        - "packages/*/src/**/*.ts"
        - "packages/*/src/**/*.tsx"
      exclude:
        - "**/*.d.ts"
        - "**/node_modules/**"
        - "**/dist/**"

  - id: "type-escapes"
    title: "Explicit any + @ts-* suppressions (typescript-eslint)"
    direction: "lower-is-better"
    gate: "per-file-count"
    timeout: "10m"
    builtin: "eslint"
    options:
      command: 'pnpm exec eslint "packages/*/src/**/*.{ts,tsx}" --config tools/pawl/eslint-gate.config.mjs --format json'
      rules:
        - "@typescript-eslint/no-explicit-any"
        - "@typescript-eslint/ban-ts-comment"

  - id: "cognitive-complexity"
    title: "Functions over cognitive-complexity 15 (sonarjs)"
    direction: "lower-is-better"
    gate: "per-file-count"
    timeout: "10m"
    builtin: "eslint"
    options:
      command: 'pnpm exec eslint "packages/*/src/**/*.{ts,tsx}" --config tools/pawl/eslint-gate.config.mjs --format json'
      rules:
        - "sonarjs/cognitive-complexity"

  - id: "code-duplication"
    title: "Duplicated code lines (jscpd, >=50 tokens)"
    direction: "lower-is-better"
    gate: "total"
    timeout: "10m"
    command: "node tools/pawl/pawl-adapter.ts code-duplication"

  - id: "circular-deps"
    title: "Circular imports within a package (packages/*/src)"
    direction: "lower-is-better"
    gate: "total"
    timeout: "10m"
    command: "node tools/pawl/pawl-adapter.ts circular-deps"

  - id: "type-coverage"
    title: "Overall type coverage (non-any identifiers)"
    direction: "higher-is-better"
    gate: "per-key-value"
    timeout: "10m"
    command: "node tools/pawl/pawl-adapter.ts type-coverage"

  - id: "test-coverage"
    title: "Lines covered by tests (vitest v8, all src in denominator)"
    direction: "higher-is-better"
    gate: "per-key-value"
    tolerance: 1
    timeout: "10m"
    command: "node tools/pawl/pawl-adapter.ts test-coverage"

  - id: "test-report"
    title: "Passed tests (vitest JSON reports)"
    direction: "higher-is-better"
    gate: "per-key-value"
    timeout: "10m"
    command: "node tools/pawl/pawl-adapter.ts test-report"
