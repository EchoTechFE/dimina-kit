<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>e2e host dialog (resizable)</title>
    <style>
      html, body { margin: 0; background: #1e1e1e; color: #ddd; font: 13px sans-serif; }
    </style>
  </head>
  <body>
    <!-- Starts at the SAME 300x200 as dialog-fixed.html so the spec's first-
         show assertion applies here too, before the grow button proves a
         re-center on a LATER content-size change. The dialog's advertiser
         re-publishes automatically on any ResizeObserver-visible change to
         #content — no explicit re-send API needed (size-advertiser.ts). -->
    <div data-host-dialog-root style="display: inline-block;">
      <div id="content" style="width: 300px; height: 200px; display: flex; align-items: center; justify-content: center;">
        e2e host dialog — resizable
      </div>
    </div>
    <button id="grow" style="position: fixed; top: 4px; left: 4px;">grow</button>
    <script>
      document.getElementById('grow').addEventListener('click', function () {
        var el = document.getElementById('content')
        el.style.width = '500px'
        el.style.height = '350px'
      })
    </script>
  </body>
</html>
