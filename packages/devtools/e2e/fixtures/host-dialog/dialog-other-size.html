<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>e2e host dialog (other size)</title>
    <style>
      html, body { margin: 0; background: #1e1e1e; color: #ddd; font: 13px sans-serif; }
    </style>
  </head>
  <body>
    <!--
      Deliberately a THIRD size (350x250) — distinct from both
      DEFAULT_WIDTH/HEIGHT (480x320) and dialog-fixed.html's 300x200 — so the
      content-swap-reset e2e spec can tell "old document's stale size" apart
      from "the reset default" and "this document's own measured size" no
      matter how fast this fixture's own ResizeObserver report happens to
      land relative to `did-finish-load`.
    -->
    <div data-host-dialog-root style="display: inline-block;">
      <div style="width: 350px; height: 250px; display: flex; align-items: center; justify-content: center;">
        e2e host dialog — other size 350x250
      </div>
    </div>
  </body>
</html>
