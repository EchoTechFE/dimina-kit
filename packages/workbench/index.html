<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>vscode-workbench</title>
    <style>
      html, body, #workbench { height: 100%; margin: 0; padding: 0; }
      #boot { font: 13px monospace; padding: 8px; color: #888; }
    </style>
    <script>
      // Paint the themed backdrop before the bundle loads, so the "booting
      // workbench…" screen and any resize gap never flash a white strip. The
      // scheme is handed in via the `?theme=light|dark` query by attachWorkbench;
      // default to dark to match the app's predominant scheme.
      (function () {
        var dark = new URLSearchParams(location.search).get('theme') !== 'light';
        var bg = dark ? '#1a1a1a' : '#fafafa';
        // `html` exists here (documentElement is always available); `body` is
        // still null while this <head> script runs, so guard it — touching
        // document.body now would throw a TypeError on every boot.
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var paintBody = function () {
          if (document.body) document.body.style.backgroundColor = bg;
        };
        if (document.body) paintBody();
        else document.addEventListener('DOMContentLoaded', paintBody);
      })();
    </script>
  </head>
  <body>
    <div id="boot">booting workbench…</div>
    <div id="workbench"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
